<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta de autenticidade | Rifa</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202735;background:#f3f5f9}*{box-sizing:border-box}main{max-width:460px;margin:7vh auto;padding:24px;background:white;border-radius:18px;box-shadow:0 4px 20px #1112}h1{font-size:24px;margin:0 0 8px}p{line-height:1.55}.pill{display:inline-block;border-radius:30px;background:#dcfce7;color:#166534;padding:8px 13px;font-weight:700}.error{background:#fee2e2;color:#991b1b}.numbers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.numbers b{border:1px solid #dbe1eb;padding:15px;text-align:center;border-radius:10px;font-size:25px;letter-spacing:2px}.muted{color:#596579;font-size:14px}.note{border-top:1px solid #e6eaf0;padding-top:14px;margin-top:20px}code{word-break:break-all}</style></head>
<body><main><h1>Consulta de autenticidade</h1><p id="status">Consultando registro…</p><div id="result"></div><p class="muted note">Compare os quatro números desta página com os quatro números impressos no bilhete. A confirmação do código não impede a existência de cópias físicas ou digitais do mesmo bilhete.</p></main>
<script>
(async()=>{const p=new URLSearchParams(location.search),c=p.get('c'),s=document.getElementById('status'),e=document.getElementById('result');
if(!c){s.textContent='Escaneie o QR Code impresso no bilhete para realizar a consulta.';return;}
try{const response=await fetch('./registro.json',{cache:'no-store'});if(!response.ok)throw Error();const db=await response.json();const v=Object.prototype.hasOwnProperty.call(db,c)?db[c]:null;
if(!v){s.innerHTML='<span class="pill error">Código não encontrado</span>';e.innerHTML='<p>Este QR Code não corresponde a um registro da lista publicada. Não aceite o bilhete sem verificação da organização.</p>';return;}
s.innerHTML='<span class="pill">Código cadastrado</span>';const h=document.createElement('h2');h.textContent='Bilhete nº '+v.bilhete;e.appendChild(h);const label=document.createElement('p');label.textContent='Números participantes:';e.appendChild(label);const n=document.createElement('div');n.className='numbers';for(const number of v.numeros){const b=document.createElement('b');b.textContent=number;n.appendChild(b)}e.appendChild(n);
const orig=document.createElement('p');orig.className='muted';orig.textContent='Referência interna: '+v.origem;e.appendChild(orig);
}catch(err){s.innerHTML='<span class="pill error">Consulta indisponível</span>';e.textContent='Não foi possível acessar o cadastro. Confira a conexão e tente novamente.';}
})();</script></body></html>
